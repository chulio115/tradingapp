name: Congress Tracker Cron

on:
  schedule:
    # Market data refresh during broad US market hours, Monday-Friday.
    # GitHub Actions cron uses UTC.
    - cron: "*/30 13-22 * * 1-5"
    # Daily filings refresh after House Clerk data is typically available.
    - cron: "15 6 * * *"
  workflow_dispatch:

jobs:
  refresh-market-data:
    name: Refresh market movers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx prisma generate

      - name: Fetch latest market movers
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          npx --yes tsx scripts/fetch-movers.ts

  check-alerts:
    name: Check alert rules
    runs-on: ubuntu-latest
    steps:
      - name: Check alert rules
        run: |
          curl --fail --show-error --silent \
            --request POST \
            --header "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            "${{ vars.APP_BASE_URL }}/api/cron/check-alerts" \
          || echo "::warning::Alert check failed. Core data refresh is unaffected; alert endpoint needs REST/service-role migration."

  refresh-congress-filings:
    name: Refresh congressional filings
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '15 6 * * *'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx prisma generate

      - name: Fetch latest congressional filings
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          npx --yes tsx scripts/fetch-trades.ts
